name: "Validate"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@__CHECKOUT_REF__

      - name: "Validate devcontainer-feature.json files"
        if: hashFiles('src/*/devcontainer-feature.json') != ''
        uses: devcontainers/action@__DEVCONTAINERS_ACTION_REF__
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@__CHECKOUT_REF__

      # ShellCheck is preinstalled on the GitHub-hosted Ubuntu runners. Scripts are collected from git
      # so that adding one needs no change here; a script without the .sh extension is out of scope.
      # The file list is printed because ShellCheck says nothing on success.
      - name: "Run ShellCheck"
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            # An empty selection is expected only before the first Feature is added. Once src/ has a
            # Feature, it means the pathspec is broken.
            if compgen -G 'src/*/devcontainer-feature.json' >/dev/null; then
              echo '::error::No shell script matched the pathspec. The file selection is broken.' >&2
              exit 1
            fi
            echo 'No shell scripts yet.'
            exit 0
          fi
          printf 'Checking %s\n' "${files[@]}"
          shellcheck -- "${files[@]}"

  # Aggregates the jobs above into a single check with a stable name, so that a branch ruleset can
  # require it without being updated whenever a job is added or renamed here.
  validation-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - shellcheck
    steps:
      - name: "Check the results of the validation jobs"
        run: |
          test '${{ needs.validate.result }}' = success \
            && test '${{ needs.shellcheck.result }}' = success
