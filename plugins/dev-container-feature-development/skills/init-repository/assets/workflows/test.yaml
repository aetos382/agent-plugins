name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Features are discovered from src/ so that adding one needs no change to this workflow.
  list-features:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.list.outputs.features }}
      has-global: ${{ steps.list.outputs.has-global }}
    steps:
      - uses: actions/checkout@__CHECKOUT_REF__

      - name: "List Features"
        id: list
        run: |
          set -euo pipefail
          shopt -s nullglob
          ids=()
          for manifest in src/*/devcontainer-feature.json; do
            ids+=("$(basename "$(dirname "${manifest}")")")
          done
          if [ "${#ids[@]}" -eq 0 ]; then
            features='[]'
          else
            features="$(printf '%s\n' "${ids[@]}" | jq -R . | jq -cs .)"
          fi
          echo "features=${features}" >> "${GITHUB_OUTPUT}"
          echo "Features: ${features}"
          if [ -f test/_global/scenarios.json ]; then
            echo 'has-global=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'has-global=false' >> "${GITHUB_OUTPUT}"
          fi

  test-autogenerated:
    needs: list-features
    if: needs.list-features.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.list-features.outputs.features) }}
        # Pinned to explicit releases rather than floating tags: tests-passed below can gate the main
        # branch, so an image moving to a new release under a floating tag would block every pull
        # request, not just surface a warning. Bumping these is therefore a deliberate change.
        baseImage:
          - debian:12
          - debian:13
          - ubuntu:24.04
          - ubuntu:26.04
          - mcr.microsoft.com/devcontainers/base:3-ubuntu24.04
          - mcr.microsoft.com/devcontainers/base:3-ubuntu26.04
    steps:
      - uses: actions/checkout@__CHECKOUT_REF__

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # Matrix values are passed through the environment rather than expanded into the script, so that
      # a directory name under src/ can never be interpreted as shell code.
      - name: "Testing '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: devcontainer features test --skip-scenarios -f "${FEATURE}" -i "${BASE_IMAGE}" .

  test-scenarios:
    needs: list-features
    if: needs.list-features.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.list-features.outputs.features) }}
    steps:
      - uses: actions/checkout@__CHECKOUT_REF__

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' scenarios"
        env:
          FEATURE: ${{ matrix.features }}
        run: devcontainer features test -f "${FEATURE}" --skip-autogenerated --skip-duplicated .

  test-global:
    needs: list-features
    if: needs.list-features.outputs.has-global == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@__CHECKOUT_REF__

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .

  # Aggregates the jobs above into a single check with a stable name, so that a branch ruleset can
  # require it without naming every matrix combination. A test job may be skipped only when
  # list-features found nothing for it to test; list-features itself must have succeeded.
  tests-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - list-features
      - test-autogenerated
      - test-scenarios
      - test-global
    steps:
      - name: "Check the results of the test jobs"
        env:
          LIST_RESULT: ${{ needs.list-features.result }}
          FEATURES: ${{ needs.list-features.outputs.features }}
          HAS_GLOBAL: ${{ needs.list-features.outputs.has-global }}
          AUTOGENERATED_RESULT: ${{ needs.test-autogenerated.result }}
          SCENARIOS_RESULT: ${{ needs.test-scenarios.result }}
          GLOBAL_RESULT: ${{ needs.test-global.result }}
        run: |
          set -euo pipefail
          test "${LIST_RESULT}" = success
          # $1: job result, $2: "true" when the job had something to test.
          check_result() {
            case "$1" in
              success) ;;
              skipped) test "$2" != true ;;
              *) return 1 ;;
            esac
          }
          has_features=true
          if [ "${FEATURES}" = '[]' ]; then
            has_features=false
          fi
          check_result "${AUTOGENERATED_RESULT}" "${has_features}"
          check_result "${SCENARIOS_RESULT}" "${has_features}"
          check_result "${GLOBAL_RESULT}" "${HAS_GLOBAL}"
