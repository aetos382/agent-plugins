name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Features are discovered from src/ so that adding one needs no change to this workflow. Each
  # Feature lists its architectures in test/<id>/architectures, and every Feature × architecture pair
  # becomes a target that runs on a native runner of that architecture.
  list-features:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      global-targets: ${{ steps.list.outputs.global-targets }}
    steps:
      - uses: actions/checkout@__CHECKOUT_REF__

      - name: "List Features and their architectures"
        id: list
        run: |
          set -euo pipefail
          shopt -s nullglob

          # The runner for each architecture, as listed in the "Architectures" table of
          # supported-platforms.md in the dev-container-feature-development plugin.
          runner_for() {
            case "$1" in
              amd64) echo 'ubuntu-24.04' ;;
              arm64) echo 'ubuntu-24.04-arm' ;;
              *) return 1 ;;
            esac
          }

          # Sets ARCHS to the architectures listed in $1/architectures, one per line. There is no
          # default for a missing file: a default would silently extend every Feature to an
          # architecture added here later, including Features whose upstream has no build for it.
          read_architectures() {
            local file="$1/architectures" line arch extra
            ARCHS=''
            if [ ! -f "${file}" ]; then
              echo "::error file=${file}::${file} is missing. List the architectures to test, one per line."
              return 1
            fi
            while IFS= read -r line || [ -n "${line}" ]; do
              read -r arch extra <<< "${line%%#*}"
              [ -n "${arch}" ] || continue
              if [ -n "${extra}" ] || ! runner_for "${arch}" >/dev/null; then
                echo "::error file=${file}::'${line}' is not an architecture this workflow tests."
                return 1
              fi
              ARCHS="${ARCHS}${arch}"$'\n'
            done < "${file}"
            if [ -z "${ARCHS}" ]; then
              echo "::error file=${file}::${file} lists no architecture."
              return 1
            fi
          }

          # $1: Feature ID, or empty for the global scenarios. Sets TARGETS to one JSON target per
          # architecture, one per line. It is not printed for command substitution, which would also
          # capture the error annotations of read_architectures and hide them from the log.
          # It is called as an if condition, where set -e does not apply, so every command that can
          # fail is checked explicitly; otherwise a failed target would silently drop from the matrix.
          targets_for() {
            local archs arch runner target
            TARGETS=''
            read_architectures "test/${1:-_global}" || return 1
            archs="$(printf '%s' "${ARCHS}" | sort -u)" || return 1
            while IFS= read -r arch; do
              runner="$(runner_for "${arch}")" || return 1
              target="$(jq -cn --arg feature "$1" --arg arch "${arch}" --arg runner "${runner}" \
                '{arch: $arch, runner: $runner} + (if $feature == "" then {} else {feature: $feature} end)')" || {
                echo "::error::Failed to build the target for ${1:-_global} on ${arch}."
                return 1
              }
              TARGETS="${TARGETS}${target}"$'\n'
            done <<< "${archs}"
          }

          # Every Feature is checked before failing, so that one run reports all broken files.
          failed=''
          targets=''
          for manifest in src/*/devcontainer-feature.json; do
            id="$(basename "$(dirname "${manifest}")")"
            if targets_for "${id}"; then
              targets="${targets}${TARGETS}"
            else
              failed=1
            fi
          done
          global_targets=''
          if [ -f test/_global/scenarios.json ]; then
            if targets_for ''; then
              global_targets="${TARGETS}"
            else
              failed=1
            fi
          fi
          [ -z "${failed}" ] || exit 1

          targets="$(printf '%s' "${targets}" | jq -cs .)"
          global_targets="$(printf '%s' "${global_targets}" | jq -cs .)"
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"
          echo "global-targets=${global_targets}" >> "${GITHUB_OUTPUT}"
          echo "Targets: ${targets}"
          echo "Global targets: ${global_targets}"

  test-autogenerated:
    name: "test-autogenerated (${{ matrix.target.feature }}, ${{ matrix.target.arch }}, ${{ matrix.baseImage }})"
    needs: list-features
    if: needs.list-features.outputs.targets != '[]'
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list-features.outputs.targets) }}
        # Pinned to explicit releases rather than floating tags: tests-passed below can gate the main
        # branch, so an image moving to a new release under a floating tag would block every pull
        # request, not just surface a warning. Bumping these is therefore a deliberate change.
        baseImage:
          - debian:12
          - debian:13
          - ubuntu:24.04
          - ubuntu:26.04
          - mcr.microsoft.com/devcontainers/base:3-ubuntu24.04
          - mcr.microsoft.com/devcontainers/base:3-ubuntu26.04
    steps:
      - uses: actions/checkout@__CHECKOUT_REF__

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # Matrix values are passed through the environment rather than expanded into the script, so that
      # a directory name under src/ can never be interpreted as shell code.
      - name: "Testing '${{ matrix.target.feature }}' on ${{ matrix.target.arch }} against '${{ matrix.baseImage }}'"
        env:
          FEATURE: ${{ matrix.target.feature }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: devcontainer features test --skip-scenarios -f "${FEATURE}" -i "${BASE_IMAGE}" .

  test-scenarios:
    name: "test-scenarios (${{ matrix.target.feature }}, ${{ matrix.target.arch }})"
    needs: list-features
    if: needs.list-features.outputs.targets != '[]'
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list-features.outputs.targets) }}
    steps:
      - uses: actions/checkout@__CHECKOUT_REF__

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.target.feature }}' scenarios on ${{ matrix.target.arch }}"
        env:
          FEATURE: ${{ matrix.target.feature }}
        run: devcontainer features test -f "${FEATURE}" --skip-autogenerated --skip-duplicated .

  test-global:
    name: "test-global (${{ matrix.target.arch }})"
    needs: list-features
    if: needs.list-features.outputs.global-targets != '[]'
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list-features.outputs.global-targets) }}
    steps:
      - uses: actions/checkout@__CHECKOUT_REF__

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios on ${{ matrix.target.arch }}"
        run: devcontainer features test --global-scenarios-only .

  # Aggregates the jobs above into a single check with a stable name, so that a branch ruleset can
  # require it without naming every matrix combination. A test job may be skipped only when
  # list-features found nothing for it to test; list-features itself must have succeeded.
  tests-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - list-features
      - test-autogenerated
      - test-scenarios
      - test-global
    steps:
      - name: "Check the results of the test jobs"
        env:
          LIST_RESULT: ${{ needs.list-features.result }}
          TARGETS: ${{ needs.list-features.outputs.targets }}
          GLOBAL_TARGETS: ${{ needs.list-features.outputs.global-targets }}
          AUTOGENERATED_RESULT: ${{ needs.test-autogenerated.result }}
          SCENARIOS_RESULT: ${{ needs.test-scenarios.result }}
          GLOBAL_RESULT: ${{ needs.test-global.result }}
        run: |
          set -euo pipefail
          test "${LIST_RESULT}" = success
          # $1: job result, $2: "true" when the job had something to test.
          check_result() {
            case "$1" in
              success) ;;
              skipped) test "$2" != true ;;
              *) return 1 ;;
            esac
          }
          has_targets=true
          if [ "${TARGETS}" = '[]' ]; then
            has_targets=false
          fi
          has_global_targets=true
          if [ "${GLOBAL_TARGETS}" = '[]' ]; then
            has_global_targets=false
          fi
          check_result "${AUTOGENERATED_RESULT}" "${has_targets}"
          check_result "${SCENARIOS_RESULT}" "${has_targets}"
          check_result "${GLOBAL_RESULT}" "${has_global_targets}"
