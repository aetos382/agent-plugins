name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per Feature under src/, named test-<id>, that calls test-feature.yaml with the Feature's ID
  # and the architectures to test it on, for example:
  #
  #   test-mytool:
  #     uses: ./.github/workflows/test-feature.yaml
  #     with:
  #       feature: mytool
  #       architectures: '["amd64", "arm64"]'
  #
  # When test/_global/scenarios.json exists, a job named test-global does the same with the feature
  # _global and the architectures that every Feature used by the global scenarios supports.

  # Aggregates the jobs above into a single check with a stable name, so that a branch ruleset can
  # require it without naming every job. Every job above must be listed under needs.
  tests-passed:
    runs-on: ubuntu-latest
    if: always()
    steps:
      # if: always() runs this job whatever the others ended with, so it must itself reject every
      # result other than "success": failure, cancelled, and skipped alike.
      - name: "Check the results of the test jobs"
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "::error::\(.key) ended with \(.value.result)."' <<< "${NEEDS}")"
          if [ -n "${failed}" ]; then
            printf '%s\n' "${failed}"
            exit 1
          fi
