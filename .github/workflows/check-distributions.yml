name: "Check supported distributions"
on:
  schedule:
    # The first of every month at 00:00 UTC. New Ubuntu LTS and Debian releases come every two years
    # or so, so a monthly check is prompt enough.
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exit status 1 means the list needs updating and is handled by the steps below. Any other
      # failure (2: network or parse error) fails this step, so that a broken check is not mistaken
      # for an up-to-date list.
      - name: "Compare with upstream release information"
        id: check
        run: |
          set -uo pipefail
          bash .github/scripts/check-supported-distributions.sh upstream \
            --new-ubuntu-releases "${RUNNER_TEMP}/new-ubuntu-releases.txt" > "${RUNNER_TEMP}/report.md"
          status=$?
          cat "${RUNNER_TEMP}/report.md"
          case "${status}" in
            0) echo 'outdated=false' >> "${GITHUB_OUTPUT}" ;;
            1) echo 'outdated=true' >> "${GITHUB_OUTPUT}" ;;
            *) exit "${status}" ;;
          esac

      # One open issue at a time: while it exists, its body is kept current instead of opening a new
      # issue every month.
      - name: "Open or update the distributions issue"
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Supported distributions need updating"
        run: |
          set -euo pipefail
          # The search is fuzzy, so the exact title is matched again in jq. gh's --jq takes no
          # --arg, hence the title comes from the environment.
          number="$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty')"
          if [ -n "${number}" ]; then
            gh issue edit "${number}" --body-file "${RUNNER_TEMP}/report.md"
            echo "Updated issue #${number}."
          else
            gh issue create --title "${ISSUE_TITLE}" --body-file "${RUNNER_TEMP}/report.md"
          fi

      # mcr.microsoft.com/devcontainers/base publishes the variant for a new Ubuntu release weeks
      # after the release, and adopting it is a human decision, so the registry is not queried.
      # Instead, each newly released Ubuntu LTS gets its own issue asking for the check. An open
      # issue is left alone, so that notes added to it are not overwritten.
      - name: "Open issues to check the devcontainers/base images"
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          template='.github/scripts/issue-templates/mcr-variant.md'
          while IFS= read -r version; do
            [ -n "${version}" ] || continue
            # The version comes from the Ubuntu release list; checked anyway because it goes into a
            # sed replacement below.
            [[ "${version}" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "Unexpected Ubuntu version '${version}'." >&2; exit 1; }
            export ISSUE_TITLE="Check mcr.microsoft.com/devcontainers/base for Ubuntu ${version}"
            number="$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number,title \
              --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty')"
            if [ -n "${number}" ]; then
              echo "Issue #${number} is already open for Ubuntu ${version}."
              continue
            fi
            sed "s/__VERSION__/${version}/g" "${template}" > "${RUNNER_TEMP}/mcr-issue.md"
            gh issue create --title "${ISSUE_TITLE}" --body-file "${RUNNER_TEMP}/mcr-issue.md"
          done < "${RUNNER_TEMP}/new-ubuntu-releases.txt"
