name: "Validate"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The latest release is installed on purpose: the plugins target the latest Claude Code only.
      # Validation runs locally and needs no credentials.
      - name: "Install Claude Code"
        run: npm install -g '@anthropic-ai/claude-code'

      - name: "Validate the marketplace"
        run: claude plugin validate --strict .

      # Plugins are discovered from the directory layout so that adding one needs no change here.
      - name: "Validate each plugin"
        run: |
          set -euo pipefail
          shopt -s nullglob
          plugins=(plugins/*/)
          if [ "${#plugins[@]}" -eq 0 ]; then
            echo '::error::No plugin directory found under plugins/.' >&2
            exit 1
          fi
          for plugin in "${plugins[@]}"; do
            claude plugin validate --strict "${plugin%/}"
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ShellCheck is preinstalled on the GitHub-hosted Ubuntu runners. The file list is printed
      # because ShellCheck says nothing on success.
      - name: "Run ShellCheck"
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo '::error::No shell script matched the pathspec. The file selection is broken.' >&2
            exit 1
          fi
          printf 'Checking %s\n' "${files[@]}"
          shellcheck -- "${files[@]}"

  # Release numbers, image names, and architectures in dev-container-feature-development must agree
  # with its source of truth, within the scope that check-supported-platforms.sh describes. Whether
  # that source is current upstream is not checked here, so that a new upstream release does not
  # fail unrelated pull requests.
  platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Check supported platforms for consistency"
        run: bash .github/scripts/check-supported-platforms.sh

  # Lints this repository's workflows and the workflow templates that plugins ship. actionlint also
  # runs ShellCheck, which its image includes, on the Bash embedded in run steps; the shellcheck job
  # above sees only *.sh files. The image is pinned by digest and updated by hand.
  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Lint the workflows of this repository"
        run: docker run --rm -v "${PWD}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

      # The templates are linted as a Git repository of their own, laid out as init-repository writes
      # them, so that calls to their reusable workflows resolve. Placeholders become a dummy ref, and
      # a Feature job is added to test.yaml, which has none, so that its call is checked against
      # test-feature.yaml. yq is preinstalled on the GitHub-hosted Ubuntu runners.
      - name: "Lint the workflow templates of dev-container-feature-development"
        run: |
          set -euo pipefail
          shopt -s nullglob
          templates=(plugins/dev-container-feature-development/skills/init-repository/assets/workflows/*.yaml)
          if [ "${#templates[@]}" -eq 0 ]; then
            echo '::error::No workflow template found. The file selection is broken.' >&2
            exit 1
          fi
          root="${RUNNER_TEMP}/workflow-templates"
          mkdir -p "${root}/.github/workflows"
          git init -q "${root}"
          for template in "${templates[@]}"; do
            sed -E 's/__[A-Z_]+__/v0/g' "${template}" > "${root}/.github/workflows/${template##*/}"
          done
          yq -i '
            .jobs = {"test-example": {"uses": "./.github/workflows/test-feature.yaml", "with": {"feature": "example", "architectures": "[\"amd64\"]"}}} + .jobs
            | .jobs.tests-passed.needs = ["test-example"]
          ' "${root}/.github/workflows/test.yaml"
          docker run --rm -v "${root}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

  # Aggregates the jobs above into a single check with a stable name, so that a branch ruleset can
  # require it without being updated whenever a job is added or renamed here.
  validation-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - plugin-validate
      - shellcheck
      - platforms
      - actionlint
    steps:
      - name: "Check the results of the validation jobs"
        run: |
          test '${{ needs.plugin-validate.result }}' = success \
            && test '${{ needs.shellcheck.result }}' = success \
            && test '${{ needs.platforms.result }}' = success \
            && test '${{ needs.actionlint.result }}' = success
