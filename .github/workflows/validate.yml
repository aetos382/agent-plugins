name: "Validate"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The latest release is installed on purpose: the plugins target the latest Claude Code only.
      # Validation runs locally and needs no credentials.
      - name: "Install Claude Code"
        run: npm install -g '@anthropic-ai/claude-code'

      - name: "Validate the marketplace"
        run: claude plugin validate --strict .

      # Plugins are discovered from the directory layout so that adding one needs no change here.
      - name: "Validate each plugin"
        run: |
          set -euo pipefail
          shopt -s nullglob
          plugins=(plugins/*/)
          if [ "${#plugins[@]}" -eq 0 ]; then
            echo '::error::No plugin directory found under plugins/.' >&2
            exit 1
          fi
          for plugin in "${plugins[@]}"; do
            claude plugin validate --strict "${plugin%/}"
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ShellCheck is preinstalled on the GitHub-hosted Ubuntu runners. The file list is printed
      # because ShellCheck says nothing on success.
      - name: "Run ShellCheck"
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo '::error::No shell script matched the pathspec. The file selection is broken.' >&2
            exit 1
          fi
          printf 'Checking %s\n' "${files[@]}"
          shellcheck -- "${files[@]}"

  # Release numbers and image names in dev-container-feature-development must agree with its source
  # of truth. Whether that source is current upstream is checked weekly by check-distributions.yml,
  # not here, so that a new upstream release does not fail unrelated pull requests.
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Check supported distributions for consistency"
        run: bash .github/scripts/check-supported-distributions.sh consistency

  # Aggregates the jobs above into a single check with a stable name, so that a branch ruleset can
  # require it without being updated whenever a job is added or renamed here.
  validation-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - plugin-validate
      - shellcheck
      - distributions
    steps:
      - name: "Check the results of the validation jobs"
        run: |
          test '${{ needs.plugin-validate.result }}' = success \
            && test '${{ needs.shellcheck.result }}' = success \
            && test '${{ needs.distributions.result }}' = success
