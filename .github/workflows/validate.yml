name: "Validate"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The latest release is installed on purpose: the plugins target the latest Claude Code only.
      # Validation runs locally and needs no credentials.
      - name: "Install Claude Code"
        run: npm install -g '@anthropic-ai/claude-code'

      - name: "Validate the marketplace"
        run: claude plugin validate --strict .

      # Plugins are discovered from the directory layout so that adding one needs no change here.
      - name: "Validate each plugin"
        run: |
          set -euo pipefail
          shopt -s nullglob
          plugins=(plugins/*/)
          if [ "${#plugins[@]}" -eq 0 ]; then
            echo '::error::No plugin directory found under plugins/.' >&2
            exit 1
          fi
          for plugin in "${plugins[@]}"; do
            claude plugin validate --strict "${plugin%/}"
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # ShellCheck is preinstalled on the GitHub-hosted Ubuntu runners. The file list is printed
      # because ShellCheck says nothing on success.
      - name: "Run ShellCheck"
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo '::error::No shell script matched the pathspec. The file selection is broken.' >&2
            exit 1
          fi
          printf 'Checking %s\n' "${files[@]}"
          shellcheck -- "${files[@]}"

  # Release numbers, image names, and architectures in dev-container-feature-development must agree
  # with its source of truth, within the scope that check-supported-platforms.sh describes. Whether
  # that source is current upstream is not checked here, so that a new upstream release does not
  # fail unrelated pull requests.
  platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Check supported platforms for consistency"
        run: bash .github/scripts/check-supported-platforms.sh

  # Lints this repository's workflows and the workflow templates that plugins ship. actionlint also
  # runs ShellCheck, which its image includes, on the Bash embedded in run steps; the shellcheck job
  # above sees only *.sh files. The image is pinned by digest and updated by hand. It comes from the
  # kjanat/actionlint fork, since rhysd/actionlint has had no release since v1.7.12 and does not know
  # newer runner labels such as ubuntu-26.04 (see rhysd/actionlint#719).
  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_IMAGE: kjanat/actionlint:1.17.0@sha256:d484cccadf56b6a356466ade9af4c8e05c5dce1badaf0a9ecd0d7639d68d9c92
    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Lint the workflows of this repository"
        run: docker run --rm -v "${PWD}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

      # The templates are linted as a Git repository of their own, laid out as init-repository writes
      # them, so that calls to their reusable workflows resolve. Placeholders become a dummy ref, and
      # a Feature job is added to ci.yaml, which has none, so that its call is checked against
      # test-feature.yaml. yq is preinstalled on the GitHub-hosted Ubuntu runners.
      - name: "Lint the workflow templates of dev-container-feature-development"
        run: |
          set -euo pipefail
          shopt -s nullglob
          templates=(plugins/dev-container-feature-development/skills/init-repository/assets/workflows/*.yaml)
          if [ "${#templates[@]}" -eq 0 ]; then
            echo '::error::No workflow template found. The file selection is broken.' >&2
            exit 1
          fi
          root="${RUNNER_TEMP}/workflow-templates"
          mkdir -p "${root}/.github/workflows"
          git init -q "${root}"
          for template in "${templates[@]}"; do
            sed -E 's/__[A-Z_]+__/v0/g' "${template}" > "${root}/.github/workflows/${template##*/}"
          done
          yq -i '
            .jobs = {"test-example": {"uses": "./.github/workflows/test-feature.yaml", "with": {"feature": "example", "architectures": "[\"amd64\"]"}}} + .jobs
            | .jobs.ci-passed.needs += ["test-example"]
          ' "${root}/.github/workflows/ci.yaml"
          docker run --rm -v "${root}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

  # A mistake in renovate.json goes unnoticed until Renovate stops after the merge, so it is
  # validated before the merge. The reusable workflow of the shared preset repository is referenced
  # by @main, like the presets. gh actions-lock does not pin a job-level uses (checked with v0.2.0),
  # so it is not in actions.lock. The Renovate version is the one written in the reusable workflow,
  # which Renovate updates there.
  renovate-config:
    uses: aetos382/renovate-presets/.github/workflows/renovate-config.yml@main

  # A mismatch between the workflows and actions.lock, or a lockfile that cannot be read, does not
  # show in the workflows themselves, and the pre-commit hook can be bypassed, so it is stopped here.
  actions-lock:
    runs-on: ubuntu-latest
    # The token is handed to an extension fetched by tag, so it is kept read-only.
    permissions:
      contents: read
    env:
      # Used to fetch the extension and for the GitHub API calls that --verify makes.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Verify actions.lock"
        run: |
          set -euo pipefail
          # Verify with the same version as the dev container.
          source .devcontainer/versions.sh
          # Renovate regenerates actions.lock with constraints.ghActionsLock, so that has to be the
          # same version. The shared Renovate preset updates both, but nothing else checks that they
          # agree.
          constraint="$(jq -r '.constraints.ghActionsLock' renovate.json)"
          if [ "${constraint}" != "${GH_ACTIONS_LOCK_VERSION}" ]; then
            echo "::error::constraints.ghActionsLock in renovate.json (${constraint}) differs from GH_ACTIONS_LOCK_VERSION in .devcontainer/versions.sh (${GH_ACTIONS_LOCK_VERSION})." >&2
            exit 1
          fi
          gh extension install github/gh-actions-lock --pin "${GH_ACTIONS_LOCK_VERSION}"
          # The exit code alone is not enough: when the GitHub API cannot be reached, the commits
          # are left unverified, which is reported only as a warning finding with exit code 0.
          # Info findings (such as the record of a deleted workflow) are allowed. Checked with v0.2.0.
          status=0
          result="$(gh actions-lock --no-fix --no-interactive --verify --json=valid,findings)" || status=$?
          printf '%s\n' "${result}"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if ! jq -e '.valid == true and all(.findings[]; .severity == "info")' <<<"${result}" >/dev/null; then
            echo '::error::gh actions-lock reported findings, or could not verify the pinned commits.' >&2
            exit 1
          fi

  # Aggregates the jobs above into a single check with a stable name, so that a branch ruleset can
  # require it without being updated whenever a job is added or renamed here.
  # Do not rename this job: the ruleset refers to it by this ID.
  ci-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - plugin-validate
      - shellcheck
      - platforms
      - actionlint
      - renovate-config
      - actions-lock
    steps:
      - name: "Check the results of the validation jobs"
        run: |
          test '${{ needs.plugin-validate.result }}' = success \
            && test '${{ needs.shellcheck.result }}' = success \
            && test '${{ needs.platforms.result }}' = success \
            && test '${{ needs.actionlint.result }}' = success \
            && test '${{ needs.renovate-config.result }}' = success \
            && test '${{ needs.actions-lock.result }}' = success
